<!DOCTYPE html>
<html>
<head>
    <title>My Study App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, lightblue, white);
            text-align: center;
        }

        .header {
            background: darkblue;
            color: white;
            padding: 25px;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 25px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 20px;
            box-shadow: 0 5px 20px gray;
        }

        button {
            padding: 12px 18px;
            margin: 6px;
            border: none;
            border-radius: 10px;
            background: darkblue;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: blue;
        }

        input, textarea, select {
            width: 85%;
            padding: 12px;
            margin: 8px;
            border: 2px solid darkblue;
            border-radius: 10px;
            font-size: 16px;
        }

        textarea {
            height: 100px;
        }

        .danger {
            background: crimson;
        }

        .item {
            background: aliceblue;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            text-align: left;
        }

        h2 {
            color: darkblue;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>📚 My Study App</h1>
    <p>My Personal Learning App</p>
</div>

<div class="container">

    <!-- CLASS -->
    <div class="card">

        <h2>📚 Select Class</h2>

        <div id="classButtons"></div>

    </div>


    <!-- CONTENT -->
    <div id="content"></div>


    <!-- ADMIN -->
    <div class="card">

        <h2>🔐 Admin Panel</h2>

        <p>নিজের Notes / Questions / MCQ যোগ করো</p>

        <input
            id="title"
            placeholder="Title লিখো"
        >

        <textarea
            id="description"
            placeholder="Content লিখো"
        ></textarea>

        <select id="type">

            <option value="note">
                📖 Note
            </option>

            <option value="question">
                ❓ Question
            </option>

            <option value="mcq">
                ✅ MCQ
            </option>

        </select>

        <br>

        <button onclick="addContent()">
            ➕ Add Content
        </button>

        <button
            class="danger"
            onclick="clearAll()">
            🗑️ Delete All
        </button>

    </div>


    <!-- SAVED CONTENT -->

    <div class="card">

        <h2>📂 Saved Content</h2>

        <div id="savedContent"></div>

    </div>

</div>


<script>

let contents =
    JSON.parse(
        localStorage.getItem("studyContents")
    ) || [];


/* CREATE CLASS BUTTONS */

let classHTML = "";

for (let i = 5; i <= 12; i++) {

    classHTML +=
        "<button onclick='showSubjects(" +
        i +
        ")'>Class " +
        i +
        "</button>";
}

document.getElementById("classButtons").innerHTML =
    classHTML;


/* SUBJECT */

function showSubjects(classNumber) {

    let subjects;

    if (classNumber <= 10) {

        subjects = [
            "বাংলা",
            "English",
            "গণিত",
            "ভৌতবিজ্ঞান",
            "জীবনবিজ্ঞান",
            "ইতিহাস",
            "ভূগোল"
        ];

    } else {

        subjects = [
            "বাংলা",
            "English",
            "Physics",
            "Chemistry",
            "Mathematics",
            "Biology"
        ];

    }


    let html =
        "<div class='card'>" +
        "<h2>Class " +
        classNumber +
        "</h2>" +
        "<p>Subject নির্বাচন করো</p>";


    subjects.forEach(function(subject) {

        html +=
            "<button onclick=\"showChapters('" +
            subject +
            "', " +
            classNumber +
            ")\">" +
            subject +
            "</button>";

    });


    html += "</div>";


    document.getElementById("content").innerHTML =
        html;
}


/* CHAPTER */

function showChapters(subject, classNumber) {

    let html =
        "<div class='card'>" +
        "<h2>📖 " +
        subject +
        "</h2>" +
        "<p>Chapter নির্বাচন করো</p>";


    for (let i = 1; i <= 10; i++) {

        html +=
            "<button onclick=\"showMaterial('" +
            subject +
            "', " +
            i +
            ")\">" +
            "Chapter " +
            i +
            "</button>";

    }


    html += "</div>";


    document.getElementById("content").innerHTML =
        html;
}


/* MATERIAL */

function showMaterial(subject, chapter) {

    let html =
        "<div class='card'>" +

        "<h2>📚 " +
        subject +
        "</h2>" +

        "<h3>📖 Chapter " +
        chapter +
        "</h3>";


    let found = contents.filter(function(item) {

        return item.title
            .toLowerCase()
            .includes(
                ("chapter " + chapter)
                .toLowerCase()
            );

    });


    if (found.length == 0) {

        html +=
            "<p>এই Chapter-এর content এখনো যোগ করা হয়নি।</p>";

    }


    found.forEach(function(item) {

        html +=
            "<div class='item'>" +

            "<h3>" +
            item.icon +
            " " +
            item.title +
            "</h3>" +

            "<p>" +
            item.description +
            "</p>" +

            "</div>";

    });


    html += "</div>";


    document.getElementById("content").innerHTML =
        html;
}


/* ADD CONTENT */

function addContent() {

    let title =
        document.getElementById("title").value;

    let description =
        document.getElementById("description").value;

    let type =
        document.getElementById("type").value;


    if (
        title == "" ||
        description == ""
    ) {

        alert(
            "Title এবং Content দুটোই লিখো 😊"
        );

        return;
    }


    let icon = "📖";

    if (type == "question") {
        icon = "❓";
    }

    if (type == "mcq") {
        icon = "✅";
    }


    contents.push({

        title: title,

        description: description,

        type: type,

        icon: icon

    });


    localStorage.setItem(
        "studyContents",
        JSON.stringify(contents)
    );


    document.getElementById("title").value = "";

    document.getElementById("description").value = "";


    displaySavedContent();
}


/* SHOW SAVED CONTENT */

function displaySavedContent() {

    let html = "";


    contents.forEach(function(item, index) {

        html +=

            "<div class='item'>" +

            "<h3>" +
            item.icon +
            " " +
            item.title +
            "</h3>" +

            "<p>" +
            item.description +
            "</p>" +

            "<button class='danger' " +
            "onclick='deleteContent(" +
            index +
            ")'>" +
            "Delete" +
            "</button>" +

            "</div>";

    });


    if (contents.length == 0) {

        html =
            "<p>এখনও কোনো content নেই।</p>";

    }


    document.getElementById(
        "savedContent"
    ).innerHTML = html;
}


/* DELETE */

function deleteContent(index) {

    contents.splice(index, 1);

    localStorage.setItem(
        "studyContents",
        JSON.stringify(contents)
    );

    displaySavedContent();
}


/* DELETE ALL */

function clearAll() {

    if (
        confirm(
            "সব content মুছে ফেলবে?"
        )
    ) {

        contents = [];

        localStorage.removeItem(
            "studyContents"
        );

        displaySavedContent();
    }
}


displaySavedContent();

</script>

</body>
</html>
